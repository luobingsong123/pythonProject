# ==============================================================================
# Redis Service 配置文件
# ==============================================================================
# 说明：
# 1. 行情源数据库配置：存储股票行情数据的 MySQL 数据库
# 2. Redis服务器配置：用于 Pub/Sub 和 Stream 的 Redis 服务器
# 3. 回测配置：回测引擎的运行参数
# ==============================================================================

[database]
# ==============================================================================
# 行情源数据库配置
# ==============================================================================
host = 192.168.1.90
port = 3306
user = root
password = Root_123
database = quant_data
charset = utf8mb4
pool_size = 50
connect_timeout = 10

# 数据库连接池配置
min_cached_connections = 2
max_cached_connections = 10
max_overflow_connections = 20

[redis]
# ==============================================================================
# Redis 服务器配置
# ==============================================================================
;host = 192.168.2.71
host = 192.168.1.86
port = 6379
db = 0
password =
encoding = utf-8
decode_responses = true
socket_timeout = 5
socket_connect_timeout = 5
max_connections = 50

# Redis 模式: single (单机), cluster (集群), auto (自动检测)
# 推荐直接指定模式以提高启动速度
# 如果不确定，请运行 test_redis_mode.py 进行检测
mode = auto

# Redis 连接池配置
min_connections = 2

[backtest]
# ==============================================================================
# 回测配置
# ==============================================================================
# 回测日期范围
start_date = 20241111
end_date = 20241111

# 选股策略配置
;strategy_id = MA10_BREAKTHROUGH
strategy_id = MA_VOLUME_FILTER
use_strategy = false
default_selection_count = 10

# 数据预加载天数（日K线开始日期提前 preload_days * 1.68 个交易日）
# 用于计算均线等技术指标时加载更多历史数据
preload_days = 60

# 是否使用 Redis Pipeline 批量推送（推荐开启）
# true: 批量推送，网络往返1次，性能高
# false: 逐条推送，网络往返N次，便于调试
use_pipeline = true

# 策略参数 (JSON 格式)
# 均线成交量策略参数
strategy_params = {"max_market_cap": 200000, "min_slope_angle": 0, "max_slope_angle": 30, "max_volume_ratio": 3}
;# MA10 突破策略参数示例
;strategy_params = {"ma_period": 10, "volume_ratio_min": 1.0, "turnover_min": 0.3}

# 均线成交量策略参数示例
# strategy_params = {"max_market_cap": 200000, "min_slope_angle": 0, "max_slope_angle": 30, "max_volume_ratio": 3}

# 交易日列表 (可选，逗号分隔)
# 如果不设置，会从数据库自动查询交易日
trade_dates = 

[market]
# ==============================================================================
# 行情 Pub/Sub 配置
# ==============================================================================
# 行情快照通道前缀
snapshot_channel_prefix = market:snapshot

# 订阅模式
subscribe_pattern = market:snapshot:*

# 行情数据推送间隔（毫秒）
push_interval = 100

[selection]
# ==============================================================================
# 股池数据存储配置
# ==============================================================================
# 数据存储结构: stream (Redis 5.0+) 或 list (Redis 3.0+)
# stream: 使用 Redis Stream，支持消费者组、消息确认等高级特性
# list: 使用 Redis List，兼容低版本 Redis，但不支持消费者组
data_structure = list
;data_structure = stream

# Key 前缀 (Stream 或 List 共用)
key_prefix = selection:stream

# 最大长度 (Stream 或 List 最大保存消息数)
maxlen = 100000

# 消费者组名称 (仅 Stream 模式有效)
consumer_group = selection_consumer

# 消费者名称 (仅 Stream 模式有效)
consumer_name = consumer_01

# Redis Key 过期时间（秒），默认24小时
expire_seconds = 86400

[consumer]
# ==============================================================================
# 消费者配置
# ==============================================================================
# 等待选股池超时时间（秒）
selection_wait_timeout = 30

# 最大消费行情快照数
max_snapshots = 1000

# 行情数据消费超时时间（秒）
market_timeout = 60

# 是否打印详细日志
verbose = true

[logging]
# ==============================================================================
# 日志配置
# ==============================================================================
# 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO

# 日志文件路径
log_file = logs/redis_service.log

# 日志文件最大大小（MB）
max_bytes = 100

# 保留日志文件数量
backup_count = 10

# 是否输出到控制台
console_output = true

[performance]
# ==============================================================================
# 性能优化配置
# ==============================================================================
# 批量操作大小
batch_size = 100

# 线程池大小
thread_pool_size = 4

# 是否启用异步模式
async_mode = false

# 数据序列化方式: json, pickle, msgpack
serializer = json
